# Serves the dashboard at /backoffice/ and proxies a few health probes to the services on the internal network.
# This container is not published: the gateway (APISIX) is the only way in, and it checks the staff session
# (forward-auth) before it lets /backoffice/api/health/* through.
# Which internal address each health probe name stands for (anything else is a 404).
map $uri $probe_target {
  default "";
  /backoffice/api/health/registry     http://registry-service:8080/actuator/health;
  /backoffice/api/health/user         http://user-service:8080/actuator/health;
  /backoffice/api/health/notification http://notification-service:8080/actuator/health;
  /backoffice/api/health/kratos       http://kratos:4433/health/ready;
  /backoffice/api/health/prometheus   http://prometheus:9090/-/healthy;
  /backoffice/api/health/grafana      http://grafana:3000/api/health;
  /backoffice/api/health/loki         http://loki:3100/ready;
  /backoffice/api/health/mailpit      http://mailpit:8025/readyz;
  /backoffice/api/health/infisical    http://infisical:8080/api/status;
}

server {
  listen 8080;
  server_name _;
  absolute_redirect off;
  root /usr/share/nginx/html;

  # Docker's embedded DNS, so a service that is down does not stop nginx from starting.
  resolver 127.0.0.11 valid=10s ipv6=off;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: http: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location = /backoffice { return 301 /backoffice/; }

  location /backoffice/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  location = /backoffice/config.json {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  # Health probes (GET only, short timeouts). The upstream status code is passed through.
  location ~ ^/backoffice/api/health/[a-z]+$ {
    if ($probe_target = "") { return 404; }
    limit_except GET { deny all; }
    proxy_pass $probe_target;
    proxy_connect_timeout 2s;
    proxy_read_timeout 3s;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    add_header Cache-Control "no-store";
    add_header X-Content-Type-Options nosniff always;
    default_type application/json;
  }

  location /backoffice/ {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: http: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    try_files $uri $uri/ /backoffice/index.html;
  }
}
