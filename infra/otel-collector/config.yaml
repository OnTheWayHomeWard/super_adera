# The one endpoint our services send telemetry to (OTLP: grpc :4317, http :4318).
# Traces -> Tempo. The metrics pipeline (exposed on :8889) is ready for services that push OTLP metrics, but none does yet: our
# services expose /actuator/prometheus and Prometheus scrapes them directly, so Prometheus does not scrape :8889.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  batch: {}
exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
