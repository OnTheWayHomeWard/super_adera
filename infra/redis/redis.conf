bind 0.0.0.0
protected-mode yes
# Never evict: Infisical and job queues must not lose keys under memory pressure.
# Our own keys all carry TTLs, so this is safe for them too.
maxmemory 256mb
maxmemory-policy noeviction
# Snapshots only (RDB), not the append-only log: with the default user disabled, Redis cannot replay MULTI/EXEC
# transactions from the AOF at start (it logged ~100k NOPERM errors per restart and skipped them anyway).
appendonly no
save 60 1
save 300 100
