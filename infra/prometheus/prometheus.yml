global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]

  - job_name: apisix            # gateway: request rates, status codes, latency
    metrics_path: /apisix/prometheus/metrics
    static_configs: [{ targets: ["apisix:9091"] }]

  - job_name: kratos            # identity: login/registration activity
    metrics_path: /admin/metrics/prometheus
    static_configs: [{ targets: ["kratos:4434"] }]

  - job_name: rabbitmq          # message broker: queues, connections
    static_configs: [{ targets: ["rabbitmq:15692"] }]

  - job_name: otel-collector    # telemetry pipeline health + metrics sent by our services
    static_configs: [{ targets: ["otel-collector:8888", "otel-collector:8889"] }]

  - job_name: loki
    static_configs: [{ targets: ["loki:3100"] }]

  - job_name: tempo
    static_configs: [{ targets: ["tempo:3200"] }]

  - job_name: alloy
    static_configs: [{ targets: ["alloy:12345"] }]

  - job_name: notification-service   # our Spring service: JVM, HTTP and delivery metrics
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["notification-service:8080"] }]

  - job_name: user-service
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["user-service:8080"] }]

  - job_name: registry-service
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["registry-service:8080"] }]
