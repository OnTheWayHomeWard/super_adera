# Loki: log storage, single container, local disk. Logs are kept 7 days.
auth_enabled: false
server:
  http_listen_port: 3100
common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
schema_config:
  configs:
    - from: "2024-04-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
limits_config:
  retention_period: 168h
  ingestion_rate_mb: 16          # default 4; first start replays existing container logs in one burst
  ingestion_burst_size_mb: 32
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
