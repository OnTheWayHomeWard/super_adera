# Staging server override. Used on the server only, on top of docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d
# - Our four images come from GHCR (built by .github/workflows/ci.yml from the staging branch) instead of a local build.
# - Everything stays bound to 127.0.0.1 as on a laptop (tests and SSH tunnels use that); only the ports below are ALSO
#   published on the server's public address: gateway 9080, docs 8090, Mailpit 8025 and SMS 8091 (both behind basic
#   auth, through the edge container), and the object store 9000 (signed image links only; the bucket is private).
# - The mode is the laptop's: ADERA_ENV=dev, console SMS, Mailpit email, fake push. Nothing real is sent.

services:
  notification-service:
    image: ghcr.io/onthewayhomeward/adera-notification-service:${ADERA_IMAGE_TAG:-staging}
  user-service:
    image: ghcr.io/onthewayhomeward/adera-user-service:${ADERA_IMAGE_TAG:-staging}
    environment:
      STORAGE_PUBLIC_ENDPOINT: http://${STAGING_PUBLIC_IP:-157.245.133.250}:9000
  registry-service:
    image: ghcr.io/onthewayhomeward/adera-registry-service:${ADERA_IMAGE_TAG:-staging}
    environment:
      STORAGE_PUBLIC_ENDPOINT: http://${STAGING_PUBLIC_IP:-157.245.133.250}:9000
      # Domains EXTERNAL banners may link to: the tracked .env's list (the server has the same file), with the same default.
      BANNER_EXTERNAL_DOMAINS: ${BANNER_EXTERNAL_DOMAINS:-adera.et,example.com}
  backoffice:
    image: ghcr.io/onthewayhomeward/adera-backoffice:${ADERA_IMAGE_TAG:-staging}
    environment:
      BACKOFFICE_MAILPIT_URL: http://${STAGING_PUBLIC_IP:-157.245.133.250}:8025
      # Grafana, Prometheus, Infisical, RabbitMQ and the RustFS console are reached through an SSH tunnel
      # (docs/src/15-staging.html), so the local addresses stay right once the tunnel is open.

  kratos:
    environment:
      # Flow URLs Kratos hands to clients (ui.action) must carry the server's address, not 127.0.0.1.
      SERVE_PUBLIC_BASE_URL: http://${STAGING_PUBLIC_IP:-157.245.133.250}:9080/kratos/

  apisix:
    ports:
      - "${STAGING_PUBLIC_IP:-157.245.133.250}:9080:9080"

  rustfs:
    ports:
      - "${STAGING_PUBLIC_IP:-157.245.133.250}:9000:9000"

  # Docs (8090) and the two dev inboxes (8025 Mailpit, 8091 SMS) behind basic auth. deploy/staging/htpasswd lives only
  # on the server (gitignored); its login is in deploy/staging/CREDENTIALS.md.
  edge:
    image: ghcr.io/onthewayhomeward/adera-edge:${ADERA_IMAGE_TAG:-staging}
    restart: unless-stopped
    depends_on:
      - mailpit
      - notification-service
    volumes:
      - ./deploy/staging/htpasswd:/etc/nginx/htpasswd:ro
    ports:
      - "${STAGING_PUBLIC_IP:-157.245.133.250}:8090:8090"
      - "${STAGING_PUBLIC_IP:-157.245.133.250}:8025:8025"
      - "${STAGING_PUBLIC_IP:-157.245.133.250}:8091:8091"

  # Bridge Lab, the test mini app (bridge-lab/). It needs bridge-lab/.local (config.json and its private key), which
  # bridge-lab/seed.py writes on the server; restart this container after a seed run.
  bridge-lab:
    image: ghcr.io/onthewayhomeward/adera-bridge-lab:${ADERA_IMAGE_TAG:-staging}
    restart: unless-stopped
    environment:
      ADERA_BASE: http://apisix:9080
      ADERA_ENV: dev
      BRIDGE_LAB_CONFIG: /app/.local/config.json
      BRIDGE_LAB_PUBLIC_URL: https://bridge-lab.157-245-133-250.sslip.io
      BRIDGE_LAB_ALT_URL: https://bridge-lab-alt.157-245-133-250.sslip.io
      BRIDGE_LAB_FOREIGN_URL: https://bridge-lab-foreign.157-245-133-250.sslip.io
      ADERA_STORAGE_PREFIX: http://157.245.133.250:9000/adera-media/
      ADERA_STORAGE_INTERNAL: http://rustfs:9000
      GRAFANA_URL: ""
      DOCS_DIR: /app/docs
    volumes:
      - ./bridge-lab/.local:/app/.local:ro
      - ./docs/guides:/app/docs:ro

  # HTTPS (Let's Encrypt) for Bridge Lab only, on free sslip.io names; see deploy/staging/Caddyfile.
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      - bridge-lab
    volumes:
      - ./deploy/staging/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "${STAGING_PUBLIC_IP:-157.245.133.250}:80:80"
      - "${STAGING_PUBLIC_IP:-157.245.133.250}:443:443"

volumes:
  caddy-data:
  caddy-config:
