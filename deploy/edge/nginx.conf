# Edge for the staging server: the static documentation, and the two dev inboxes (Mailpit for email, the console SMS
# messages) behind one shared login, because anyone who can read them can take over any staging account.
# The API and the backoffice are not here: they stay on the gateway (APISIX, port 9080).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 8090: documentation (docs/ baked into the image at build time)
server {
    listen 8090;
    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri $uri/ =404;
    }
}

# 8025: Mailpit web UI and API (the verification, reset and staff login emails)
server {
    listen 8025;
    auth_basic "Adera staging inbox";
    auth_basic_user_file /etc/nginx/htpasswd;
    location / {
        proxy_pass http://mailpit:8025;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;          # Mailpit pushes new mail over a websocket
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
    }
}

# 8091: the SMS messages the console provider "sent" (codes), as a page (/) and as JSON (/messages?to=+2519...)
server {
    listen 8091;
    auth_basic "Adera staging inbox";
    auth_basic_user_file /etc/nginx/htpasswd;
    root /usr/share/nginx/sms;
    location = / {
        try_files /index.html =404;
    }
    location = /messages {
        limit_except GET { deny all; }
        proxy_pass http://notification-service:8080/dev/messages$is_args$args;
    }
}
